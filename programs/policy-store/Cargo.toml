[package]
name = "policy-store-program"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
bpf-entrypoint = []
no-entrypoint = []

[dependencies]
bytemuck = { workspace = true }
custom-ring-interface = { workspace = true }
pinocchio = { workspace = true, features = ["cpi"] }
pinocchio-system = { workspace = true }
thiserror = { workspace = true }
zolana-account-checks = { workspace = true }
zolana-hasher = { workspace = true }
zolana-interface = { workspace = true }
zolana-ring-policy = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
litesvm = { workspace = true }
serde_json = { workspace = true }
solana-address = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-transaction-error = { workspace = true }
zolana-client = { workspace = true }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("solana"))']
