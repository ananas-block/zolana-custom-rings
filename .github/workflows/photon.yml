name: photon

on:
  push:
    branches: [main]
    paths:
      - "services/photon/**"
      - "program-libs/**"
      - "sdk-libs/indexer/**"
      - "zolana"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/photon.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "services/photon/**"
      - "program-libs/**"
      - "sdk-libs/indexer/**"
      - "zolana"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/photon.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  test:
    name: tests / photon
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: ./zolana/.github/actions/setup-rust
        with:
          install-just: "false"
          shared-key: photon
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - name: Install database client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client
      - name: Verify PostgreSQL migrations
        run: |
          cargo run --locked -p custom-ring-photon --bin photon-migration -- up
          cargo run --locked -p custom-ring-photon --bin photon-migration -- status

          schema_ready="$(psql "$DATABASE_URL" --tuples-only --no-align --command "
            WITH required(name) AS (
              VALUES
                ('state_trees'),
                ('tree_metadata'),
                ('rings_transactions'),
                ('custom_ring_cursor'),
                ('custom_ring_blocks'),
                ('custom_ring_pending'),
                ('ring_registries'),
                ('ring_registry_roots'),
                ('ring_records'),
                ('ring_record_nodes'),
                ('ring_record_queue')
            )
            SELECT bool_and(to_regclass('public.' || name) IS NOT NULL)
            FROM required;
          ")"
          test "$schema_ready" = "t"

          cargo run --locked -p custom-ring-photon --bin photon-migration -- down --num 2
          cargo run --locked -p custom-ring-photon --bin photon-migration -- up
      - name: Run Photon tests
        run: cargo test --locked -p custom-ring-photon --all-targets
