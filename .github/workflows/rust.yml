name: rust

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - ".gitignore"
      - "sdk-libs/ts/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - ".gitignore"
      - "sdk-libs/ts/**"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  RUSTFLAGS: "-D warnings"
  SBF_TOOLS_VERSION: v1.54
  NEXTEST_PROFILE: ci

jobs:
  # A release image or key must come from a zolana commit on main or release/*.
  zolana-pin:
    name: zolana pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - run: git -C zolana fetch --unshallow --no-tags origin || true
      - run: cd zolana && tools/check-release-source.sh HEAD

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - name: Install workspace Rust toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check

  machete:
    name: cargo-machete
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: ./zolana/.github/actions/setup-rust
        with:
          shared-key: machete
          install-just: "false"
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-machete
      - run: cargo machete --skip-target-dir cli program-libs program-tests programs sdk-libs services

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: ./zolana/.github/actions/setup-rust
        with:
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - run: just clippy

  check:
    name: cargo check (workspace)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: ./zolana/.github/actions/setup-rust
        with:
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - run: just check-all

  test-program:
    name: tests / custom-ring program
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      AGAVE_VERSION: v4.2.2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: ./zolana/.github/actions/setup-rust
        with:
          shared-key: litesvm
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - uses: ./zolana/.github/actions/install-anza
        with:
          version: ${{ env.AGAVE_VERSION }}
      - uses: ./zolana/.github/actions/install-sbf-tools
        with:
          version: ${{ env.SBF_TOOLS_VERSION }}
      - run: just test-program-fast

  test-sdk-libs:
    name: tests / sdk-libs
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: ./zolana/.github/actions/setup-rust
        with:
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - run: just test-sdk-libs

  # The localnet matrix's inputs, built in parallel jobs.
  build-localnet-programs:
    name: build / localnet programs
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      AGAVE_VERSION: v4.2.2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: ./zolana/.github/actions/setup-rust
        with:
          shared-key: litesvm
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - uses: ./zolana/.github/actions/install-anza
        with:
          version: ${{ env.AGAVE_VERSION }}
      - uses: ./zolana/.github/actions/install-sbf-tools
        with:
          version: ${{ env.SBF_TOOLS_VERSION }}
      - run: just build-programs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: localnet-programs-${{ github.sha }}
          path: |
            target/deploy/*.so
            zolana/target/deploy/*.so
          if-no-files-found: error
          retention-days: 1

  build-localnet-tools:
    name: build / localnet tools
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: zolana/prover/server/go.mod
          cache-dependency-path: zolana/prover/server/go.sum
      - uses: ./zolana/.github/actions/setup-rust
        with:
          shared-key: localnet-photon
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - run: just build-localnet-tools
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: localnet-tools-${{ github.sha }}
          path: |
            zolana/target/debug/zolana
            zolana/target/debug/xtask
            target/prover-server
            target/debug/zolana-ring
            target/debug/photon
            target/debug/ring-indexer
          if-no-files-found: error
          retention-days: 1

  build-localnet-tests:
    name: build / localnet suites
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: ./zolana/.github/actions/setup-rust
        with:
          shared-key: localnet-photon
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - run: just build-localnet-archives
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: localnet-tests-${{ github.sha }}
          path: target/nextest-archives/
          if-no-files-found: error
          retention-days: 1

  test-localnet:
    name: tests / localnet / ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [build-localnet-programs, build-localnet-tools, build-localnet-tests]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: custom-ring lifecycle
            recipe: test-custom-ring-validator
          - name: custom-ring shared sources
            recipe: test-custom-ring-shared
          - name: custom-ring policy rules
            recipe: test-custom-ring-rules
          - name: custom-ring policy re-pin
            recipe: test-custom-ring-repin
    env:
      AGAVE_VERSION: v4.2.2
      ZOLANA_PREBUILT: "1"
      ZOLANA_XTASK_BIN: ${{ github.workspace }}/zolana/target/debug/xtask
      ZOLANA_NEXTEST_ARCHIVE_DIR: target/nextest-archives
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: ./.github/actions/free-runner-disk
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: zolana/prover/server/go.mod
          cache-dependency-path: zolana/prover/server/go.sum
      - uses: ./zolana/.github/actions/setup-rust
        with:
          shared-key: localnet-photon
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - uses: ./zolana/.github/actions/install-anza
        with:
          version: ${{ env.AGAVE_VERSION }}
      - uses: ./zolana/.github/actions/install-sbf-tools
        with:
          version: ${{ env.SBF_TOOLS_VERSION }}
      - name: Cache proving keys
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: zolana/prover/server/proving-keys
          key: proving-keys-${{ hashFiles('zolana/prover/server/prover/provingkeys/proving-keys.lock', 'prover/ring/proving-keys.lock') }}
      - name: Cache surfpool
        id: surfpool-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: zolana/target/tools/surfpool
          key: surfpool-${{ runner.os }}-${{ hashFiles('zolana/justfile') }}
      - name: Install surfpool
        if: steps.surfpool-cache.outputs.cache-hit != 'true'
        run: just zolana::install-surfpool
      - name: Download prebuilt programs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: localnet-programs-${{ github.sha }}
          path: .
      - name: Download prebuilt tools
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: localnet-tools-${{ github.sha }}
          path: .
      - name: Download prebuilt localnet suites
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: localnet-tests-${{ github.sha }}
          path: target/nextest-archives
      - run: chmod 0755 zolana/target/debug/zolana zolana/target/debug/xtask target/prover-server target/debug/zolana-ring target/debug/photon target/debug/ring-indexer
      - name: Cache Squads smart account binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: squads-cache
        with:
          path: zolana/target/deploy/squads_smart_account_program.so
          key: squads-smart-account-SMRTzfY6DfH5ik3TKiyLFfXexV8uSG3d2UksSCYdunG
      - name: Fetch Squads smart account binary
        if: steps.squads-cache.outputs.cache-hit != 'true'
        run: just zolana::fetch-smart-account
      - run: just ${{ matrix.recipe }}
      - name: Dump prover, photon and ring indexer logs on failure
        if: failure()
        run: |
          find . -name prover-server.log -print -exec tail -200 {} \; 2>/dev/null || echo "(no prover log)"
          find . -name photon.log -print -exec tail -100 {} \; 2>/dev/null || echo "(no photon log)"
          find . -name ring-indexer.log -print -exec tail -100 {} \; 2>/dev/null || echo "(no ring indexer log)"
