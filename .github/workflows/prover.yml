name: prover

on:
  push:
    branches: [main]
    paths:
      - "prover/**"
      - "program-libs/interface/**"
      - "programs/custom-ring/**"
      - "sdk-libs/sdk/**"
      - "sdk-libs/ts/src/**"
      - "tools/*ring_keys.py"
      - "zolana"
      - ".github/workflows/prover.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "prover/**"
      - "program-libs/interface/**"
      - "programs/custom-ring/**"
      - "sdk-libs/sdk/**"
      - "sdk-libs/ts/src/**"
      - "tools/*ring_keys.py"
      - "zolana"
      - ".github/workflows/prover.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  combined-image:
    name: prover / combined image
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - name: Build combined client prover image
        run: docker build --file prover/Dockerfile --tag combined-prover:test .
      - name: Check native and ring circuits in one image
        run: |
          docker run --rm combined-prover:test key-files > /tmp/prover-key-files
          grep -qx 'transfer_ring_1_2.key' /tmp/prover-key-files
          grep -qx 'custom_ring_apply_records_1.key' /tmp/prover-key-files
          docker run --rm combined-prover:test release-keys > /tmp/prover-release-keys
          grep -q '^custom_ring_apply_records_1.key ' /tmp/prover-release-keys

  go-tests:
    name: prover / go test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 60
    defaults:
      run:
        working-directory: prover
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: prover/go.mod
          cache-dependency-path: prover/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -p 1 ./... -timeout 50m

  installed-keys:
    name: prover / installed keys
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 90
    env:
      REQUIRE_RING_KEYS: "1"
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: ./.github/actions/free-runner-disk
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: prover/go.mod
          cache-dependency-path: prover/go.sum
      - uses: ./zolana/.github/actions/setup-rust
        with:
          shared-key: ring-proving-keys
          private-libs-token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: zolana/prover/server/proving-keys
          key: proving-keys-${{ hashFiles('prover/ring/proving-keys.lock', 'zolana/prover/server/prover/provingkeys/proving-keys.lock') }}
      - name: Verify every committed verifier against its pinned proving key
        env:
          GH_TOKEN: ${{ github.token }}
        run: just check-custom-ring-keys
      - name: Compile, prove and verify every catalog shape with installed keys
        working-directory: prover
        run: go test ./ring -run 'TestRingKeysCarryTheCompiledCircuits|TestCatalogRequestsProveWithTheInstalledKeys|TestGoldenRequestsProveWithTheInstalledKeys' -timeout 75m
