name: Build artifact
description: Reuse cached builds and transfer their outputs through artifacts of the current run.
inputs:
  name:
    description: Artifact name.
    required: true
  mode:
    description: lookup restores a cached build; save publishes it; restore downloads the run artifact.
    required: true
  cached:
    description: The build was restored by lookup and needs no new cache entry.
    default: "false"
outputs:
  hit:
    description: The cache holds the artifact.
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - id: spec
      shell: bash
      env:
        NAME: ${{ inputs.name }}
      run: tools/ci/artifact.sh "$NAME" >> "$GITHUB_OUTPUT"
    - id: restore
      if: inputs.mode == 'lookup'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        key: ${{ steps.spec.outputs.key }}
        path: ${{ steps.spec.outputs.path }}
    - if: inputs.mode == 'save' && inputs.cached != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        key: ${{ steps.spec.outputs.key }}
        path: ${{ steps.spec.outputs.path }}
    # Caches can be evicted while consumers wait. Run artifacts cannot.
    - if: inputs.mode == 'save'
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        ARTIFACT_PATHS: ${{ steps.spec.outputs.path }}
      run: printf '%s\n' "$ARTIFACT_PATHS" | tar -cf "$RUNNER_TEMP/$NAME.tar" -T -
    - if: inputs.mode == 'save'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ inputs.name }}
        path: ${{ runner.temp }}/${{ inputs.name }}.tar
        if-no-files-found: error
        overwrite: true
        compression-level: 1
        retention-days: 1
    - if: inputs.mode == 'restore'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: ${{ inputs.name }}
        path: ${{ runner.temp }}/ring-ci-artifacts
    - if: inputs.mode == 'restore'
      shell: bash
      env:
        NAME: ${{ inputs.name }}
      run: |
        tar -xf "$RUNNER_TEMP/ring-ci-artifacts/$NAME.tar"
        rm "$RUNNER_TEMP/ring-ci-artifacts/$NAME.tar"
